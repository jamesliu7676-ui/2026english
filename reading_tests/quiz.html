<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短篇閱讀測驗題庫</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #5d687a;
      --line: #d9dfeb;
      --accent: #1f7a68;
      --accent-weak: #e6f4ef;
      --warn: #9a4f13;
      --warn-bg: #fff3e3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      color: var(--muted);
      font-size: .95rem;
    }

    select,
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 6px 10px;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }

    main {
      padding: 24px 0 40px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 1.35rem;
    }

    .stat span {
      color: var(--muted);
      font-size: .9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .passage + .passage {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    h2,
    h3 {
      margin: 0 0 10px;
      letter-spacing: 0;
    }

    h2 {
      font-size: 1.15rem;
    }

    h3 {
      font-size: 1rem;
    }

    .meta {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 14px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
    }

    .question-type {
      display: inline-flex;
      align-items: center;
      background: var(--accent-weak);
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question p {
      margin: 0 0 10px;
      font-weight: 650;
    }

    ol {
      margin: 0;
      padding-left: 22px;
    }

    details {
      margin-top: 10px;
      color: var(--muted);
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 650;
    }

    .warning {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid #f2d3aa;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .topbar,
      .layout {
        grid-template-columns: 1fr;
        display: grid;
      }

      .status {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <h1>短篇閱讀測驗題庫</h1>
      <div class="controls">
        <label for="count">題數</label>
        <select id="count">
          <option value="5">5 題</option>
          <option value="8" selected>8 題</option>
          <option value="10">10 題</option>
        </select>
        <button id="refresh" type="button">更新題目</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="status" aria-label="題庫狀態">
      <div class="stat"><strong id="totalQuestions">0</strong><span>題庫題數</span></div>
      <div class="stat"><strong id="shownQuestions">0</strong><span>本次出題</span></div>
      <div class="stat"><strong id="duplicateRate">0%</strong><span>本次重複率</span></div>
      <div class="stat"><strong id="sourceCount">0</strong><span>閱讀文本</span></div>
    </section>

    <div id="notice" class="warning" hidden></div>

    <section class="layout">
      <article class="panel">
        <h2 id="readingTitle">Reading</h2>
        <div id="readingMeta" class="meta"></div>
        <div id="passages"></div>
      </article>

      <aside class="panel">
        <h2>Questions</h2>
        <div id="questions"></div>
      </aside>
    </section>
  </main>

  <script>
    const RECENT_KEY = "reading_tests_recent_question_ids";
    const RECENT_LIMIT = 120;
    const TARGET_DUPLICATE_RATE = 0.05;

    const state = {
      bank: null,
      currentReading: null,
      currentQuestions: []
    };

    const els = {
      count: document.querySelector("#count"),
      refresh: document.querySelector("#refresh"),
      totalQuestions: document.querySelector("#totalQuestions"),
      shownQuestions: document.querySelector("#shownQuestions"),
      duplicateRate: document.querySelector("#duplicateRate"),
      sourceCount: document.querySelector("#sourceCount"),
      notice: document.querySelector("#notice"),
      readingTitle: document.querySelector("#readingTitle"),
      readingMeta: document.querySelector("#readingMeta"),
      passages: document.querySelector("#passages"),
      questions: document.querySelector("#questions")
    };

    function readRecent() {
      try {
        const value = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function writeRecent(ids) {
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(-RECENT_LIMIT)));
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function allQuestions(bank) {
      return bank.items.flatMap(item => item.questions.map(question => ({
        ...question,
        readingId: item.id,
        readingTitle: item.title
      })));
    }

    function chooseReading(bank, count) {
      const candidates = bank.items.filter(item => item.questions.length >= Math.min(count, 5));
      return shuffle(candidates)[0] || bank.items[0];
    }

    function chooseQuestions(reading, count) {
      const recent = new Set(readRecent());
      const shuffled = shuffle(reading.questions);
      const fresh = shuffled.filter(question => !recent.has(question.id));
      const fallback = shuffled.filter(question => recent.has(question.id));
      const selected = [...fresh, ...fallback].slice(0, Math.min(count, shuffled.length));
      const selectedIds = selected.map(question => question.id);
      writeRecent([...readRecent(), ...selectedIds]);
      return selected;
    }

    function calculateDuplicateRate(questions) {
      const ids = questions.map(question => question.id);
      const unique = new Set(ids);
      if (!ids.length) return 0;
      return (ids.length - unique.size) / ids.length;
    }

    function renderReading(reading) {
      els.readingTitle.textContent = reading.title;
      els.readingMeta.textContent = `${reading.topic}｜${reading.source_type}｜${reading.usage}`;
      els.passages.innerHTML = "";
      reading.passages.forEach(passage => {
        const section = document.createElement("section");
        section.className = "passage";
        section.innerHTML = `<h3>${passage.label}</h3><p>${passage.text}</p>`;
        els.passages.appendChild(section);
      });
    }

    function renderQuestions(questions) {
      els.questions.innerHTML = "";
      questions.forEach((question, index) => {
        const article = document.createElement("article");
        article.className = "question";
        const options = question.options.map((option, optionIndex) => {
          const letter = String.fromCharCode(65 + optionIndex);
          return `<li value="${optionIndex + 1}">${letter}. ${option}</li>`;
        }).join("");
        const brief = question.sample_brief_answer
          ? `<p><strong>簡答參考：</strong>${question.sample_brief_answer}</p>`
          : "";
        article.innerHTML = `
          <div class="question-type">${question.type}</div>
          <p>${index + 1}. ${question.question}</p>
          <ol>${options}</ol>
          <details>
            <summary>答案與解析</summary>
            <p><strong>答案：</strong>${question.answer}</p>
            <p>${question.explanation}</p>
            ${brief}
          </details>
        `;
        els.questions.appendChild(article);
      });
    }

    function renderStatus(bank, questions) {
      const duplicateRate = calculateDuplicateRate(questions);
      els.totalQuestions.textContent = allQuestions(bank).length;
      els.shownQuestions.textContent = questions.length;
      els.duplicateRate.textContent = `${Math.round(duplicateRate * 100)}%`;
      els.sourceCount.textContent = bank.items.length;

      if (duplicateRate >= TARGET_DUPLICATE_RATE) {
        els.notice.hidden = false;
        els.notice.textContent = "本次題目重複率已達 5% 以上，請增加題庫或降低每次出題題數。";
      } else {
        els.notice.hidden = true;
        els.notice.textContent = "";
      }
    }

    function refreshQuiz() {
      if (!state.bank) return;
      const count = Number(els.count.value);
      const reading = chooseReading(state.bank, count);
      const questions = chooseQuestions(reading, count);
      state.currentReading = reading;
      state.currentQuestions = questions;
      renderReading(reading);
      renderQuestions(questions);
      renderStatus(state.bank, questions);
    }

    async function init() {
      try {
        const response = await fetch("./question_bank.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.bank = await response.json();
        refreshQuiz();
      } catch (error) {
        els.questions.innerHTML = `<p class="empty">無法載入 question_bank.json。請用本機伺服器開啟此頁面。</p>`;
        els.notice.hidden = false;
        els.notice.textContent = error.message;
      }
    }

    els.refresh.addEventListener("click", refreshQuiz);
    els.count.addEventListener("change", refreshQuiz);
    init();
  </script>
</body>
</html>
